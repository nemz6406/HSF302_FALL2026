<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Chi tiết sản phẩm</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<main class="container py-4" style="max-width: 600px">
    <h2 class="h4 mb-3">Chi tiết sản phẩm</h2>

    <div class="card shadow-sm" th:object="${sanPham}">
        <div class="card-body">
            <h5 class="card-title text-primary" th:text="*{ten}">Tên sản phẩm</h5>
            <p class="card-text mb-2">
                <strong>Giá:</strong>
                <span th:text="${#numbers.formatDecimal(sanPham.gia, 0, 'COMMA', 0, 'POINT')}">0</span> VNĐ
            </p>
            <p class="card-text mb-3">
                <strong>Số lượng:</strong>
                <span th:text="*{soLuong}">0</span>
            </p>

            <div class="d-flex gap-2">
                <a th:href="@{/sanpham/ket-qua}" class="btn btn-outline-secondary">Quay lại danh sách</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
